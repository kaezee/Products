name: gitleaks

# Secret scanning on every push and PR. Uses the gitleaks binary directly
# (not the licensed marketplace Action) so it runs free on any repo.

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan sees every commit
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
