name: gitleaks

# Secret scanning. Uses the gitleaks binary directly (not the licensed
# marketplace Action) so it runs free on any repo.

on:
  # Feature branches are covered by the pull_request trigger; only scan direct
  # pushes to main (and tags) so open PRs don't run twice for the same commit.
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan sees every commit
      - name: Install gitleaks
        # Download to a file with retries so a flaky GitHub CDN connection reset
        # doesn't fail the whole job (a bare `curl | tar` has no second chance).
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 \
            -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
