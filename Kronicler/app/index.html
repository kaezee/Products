<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%B6%3C/text%3E%3C/svg%3E" />
    <title>Kronicler</title>
    <script>
      // Set the theme synchronously, before any CSS, so there's no flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('k.theme') || 'paper';
          if (t === 'grey') { t = 'white'; localStorage.setItem('k.theme', t); } // migrated: grey → white
          if (t === 'system') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'paper';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'paper');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
